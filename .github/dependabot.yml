version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /bootstrap/backend
      - /modules/account-security
      - /modules/zone
      - /stacks/r2
      - /stacks/security-account
      - /stacks/workers
      - /stacks/zone
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      terraform-providers:
        patterns: ["*"]

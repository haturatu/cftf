name: Merge and request private apply

"on":
  pull_request_target:
    branches: [master]
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Terraform checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Retry a request for a merged or open pull request
        required: true
        type: string

permissions: {}

concurrency:
  group: terraform-merge-controller
  cancel-in-progress: false
  queue: max

jobs:
  control:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      checks: read
      actions: read
    steps:
      - name: Read controller only from the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Create a token scoped to dispatching the private workflow
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: haturatu
          repositories: cftf-deploy
          permission-actions: write
      - name: Approve a commit, merge checked code, and request deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          ALLOWED_APPLIERS: ${{ vars.ALLOWED_APPLIERS || '["haturatu"]' }}
        run: .github/scripts/control.sh

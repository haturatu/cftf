name: Terraform checks

"on":
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Validate public code without infrastructure credentials
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          .github/scripts/control.test.sh
          ./scripts/tf.test.sh
          for root in stacks/zone stacks/r2 stacks/workers bootstrap/backend; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=modules/zone init -backend=false -input=false
          terraform -chdir=modules/zone test
          terraform -chdir=bootstrap/backend test
